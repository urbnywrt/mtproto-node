name: Build & Push Docker Image

on:
  push:
    branches: [master, dev, 'feature/**']
  workflow_dispatch:

jobs:
  build:
    name: Build Service Node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Every branch gets its own tag so nodes can pull a build instead of compiling one.
      # Only master and dev move :latest — a manual run from a feature branch used to
      # publish it as :latest, which every node on master would then pull.
      - name: Derive image tags
        run: |
          SLUG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "SLUG=$SLUG" >> $GITHUB_ENV
          if [ "$GITHUB_REF_NAME" = "master" ] || [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "MOVE_LATEST=true" >> $GITHUB_ENV
          else
            echo "MOVE_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER }}/mtproto-node:${{ env.SLUG }}
            ghcr.io/${{ env.OWNER }}/mtproto-node:${{ github.sha }}
            ${{ env.MOVE_LATEST == 'true' && format('ghcr.io/{0}/mtproto-node:latest', env.OWNER) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
